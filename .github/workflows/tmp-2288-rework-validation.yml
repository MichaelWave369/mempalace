name: Temporary #2288 rework validation

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.head_ref == 'fix/graph-stats-completeness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/graph-stats-completeness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply reviewed #2288 rework
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mempalace/palace_graph.py')
          s = p.read_text()
          s = s.replace('if not room or room == "general" or not wing:', 'if not room or not wing:', 1)
          s = s.replace('if room and room != "general" and wing:', 'if room and wing:', 1)
          a=s.index('def graph_stats(col=None, config=None):'); b=s.index('\n\ndef _fuzzy_match(',a)
          s=s[:a]+'''def graph_stats(col=None, config=None):
    """Summary statistics about the palace graph.

    ``total_rooms`` keeps its historical meaning: unique room-name nodes in
    the passive graph. ``total_room_instances`` counts distinct (wing, room)
    placements, which is the number users naturally compare with ``status``.
    """
    nodes, edges = build_graph(col, config)
    passive_tunnel_rooms = sum(1 for n in nodes.values() if len(n["wings"]) >= 2)
    total_room_instances = sum(len(n["wings"]) for n in nodes.values())
    explicit_tunnel_count = len(_load_tunnels(config))
    wing_counts = Counter()
    for data in nodes.values():
        for w in data["wings"]: wing_counts[w] += 1
    return {
        "total_rooms": len(nodes), "total_room_instances": total_room_instances,
        "tunnel_rooms": passive_tunnel_rooms, "passive_tunnel_rooms": passive_tunnel_rooms,
        "explicit_tunnels": explicit_tunnel_count, "total_edges": len(edges),
        "total_connections": len(edges) + explicit_tunnel_count,
        "rooms_per_wing": dict(wing_counts.most_common()),
        "top_tunnels": [{"room": r, "wings": d["wings"], "count": d["count"]}
            for r,d in sorted(nodes.items(), key=lambda x: -len(x[1]["wings"]))[:10]
            if len(d["wings"]) >= 2],
    }
'''+s[b:]
          p.write_text(s)

          p=Path('mempalace/mcp_server.py'); s=p.read_text()
          anchor='    delete_tunnel,\n    follow_tunnels,\n)'
          s=s.replace(anchor,'    delete_tunnel,\n    follow_tunnels,\n    _load_tunnels as _load_graph_tunnels,\n)',1)
          s=s.replace('wing and a usable room name (the catch-all ``"general"`` is excluded), and\n','wing and a usable room name (including the catch-all ``"general"``), and\n',1)
          a=s.index('def _graph_stats_from_grouped_rows(rows):'); b=s.index('\n\ndef _graph_sqlite_reader()',a)
          s=s[:a]+'''def _graph_stats_from_grouped_rows(rows):
    """Rebuild graph stats from grouped sqlite rows.

    Grouping includes hall, so room instances are a distinct (wing, room) set.
    """
    from collections import Counter, defaultdict
    room_data = defaultdict(lambda: {"wings": set(), "halls": set(), "count": 0})
    room_instances = set()
    for row in rows:
        room, wing, hall, n = row[0], row[1], row[2], row[3]
        if not room or not wing: continue
        room, wing = str(room), str(wing)
        room_instances.add((wing, room))
        node = room_data[room]; node["wings"].add(wing)
        if hall: node["halls"].add(str(hall))
        node["count"] += int(n)
    passive_tunnel_rooms=0; total_edges=0; wing_counts=Counter()
    for data in room_data.values():
        nw=len(data["wings"])
        for wing in data["wings"]: wing_counts[wing]+=1
        if nw >= 2:
            passive_tunnel_rooms += 1
            total_edges += (nw * (nw - 1) // 2) * len(data["halls"])
    top_tunnels=[{"room":room,"wings":sorted(data["wings"]),"count":data["count"]}
        for room,data in sorted(room_data.items(), key=lambda kv:(-len(kv[1]["wings"]),kv[0]))[:10]
        if len(data["wings"]) >= 2]
    explicit_tunnel_count = len(_load_graph_tunnels(_config))
    return {"total_rooms":len(room_data),"total_room_instances":len(room_instances),
        "tunnel_rooms":passive_tunnel_rooms,"passive_tunnel_rooms":passive_tunnel_rooms,
        "explicit_tunnels":explicit_tunnel_count,"total_edges":total_edges,
        "total_connections":total_edges+explicit_tunnel_count,
        "rooms_per_wing":dict(wing_counts.most_common()),"top_tunnels":top_tunnels}
'''+s[b:]
          p.write_text(s)

          p=Path('tests/test_palace_graph.py'); s=p.read_text()
          s=s.replace('    def test_general_room_excluded(self):','    def test_general_room_included(self):',1)
          s=s.replace('        assert "general" not in nodes','        assert "general" in nodes\n        assert nodes["general"]["wings"] == ["wing_code"]',1)
          s+='''\n\ndef test_2288_grouped_general_and_stats():
    from mempalace.palace_graph import _nodes_edges_from_grouped_rows
    nodes, _ = _nodes_edges_from_grouped_rows([("general","a","h1",2,"d"),("general","a","h2",3,"d"),("general","b","h1",1,"d")])
    assert nodes["general"]["wings"] == ["a", "b"]
    col=_make_fake_collection([{"room":"fact","wing":"w1"},{"room":"general","wing":"w2"},{"room":"general","wing":"w3"}])
    with patch.dict(graph_stats.__globals__, {"_load_tunnels": lambda config=None: [{"id":"t"}]}):
        stats=graph_stats(col=col)
    assert stats["total_rooms"] == 2
    assert stats["total_room_instances"] == 3
    assert stats["explicit_tunnels"] == 1
'''
          p.write_text(s)

          p=Path('tests/test_mcp_server.py'); s=p.read_text()
          s=s.replace('# "general" room and the wing-less drawer are excluded, matching\n        # build_graph\'s per-drawer filter.\n        assert stats["total_rooms"] == 2','# "general" is a real room; the wing-less drawer is still excluded.\n        assert stats["total_rooms"] == 3',1)
          s+='''\n\ndef test_2288_grouped_stats_distinct_room_instances(monkeypatch):
    from mempalace import mcp_server
    monkeypatch.setattr(mcp_server, "_load_graph_tunnels", lambda config=None: [{"id":"t1"},{"id":"t2"}])
    rows=[("general","a","h1",2,"d"),("general","a","h2",3,"d"),("general","b","h1",1,"d"),("fact","c","h",1,"d")]
    stats=mcp_server._graph_stats_from_grouped_rows(rows)
    assert stats["total_rooms"] == 2
    assert stats["total_room_instances"] == 3
    assert stats["tunnel_rooms"] == stats["passive_tunnel_rooms"] == 1
    assert stats["explicit_tunnels"] == 2
    assert stats["total_connections"] == stats["total_edges"] + 2
'''
          p.write_text(s)
          PY
      - run: ruff format mempalace/palace_graph.py mempalace/mcp_server.py tests/test_palace_graph.py tests/test_mcp_server.py
      - run: python -m pytest -q tests/test_palace_graph.py tests/test_palace_graph_tunnels.py
      - run: python -m pytest -q tests/test_mcp_server.py -k 'graph_stats or tunnel or 2288'
      - run: ruff check mempalace/palace_graph.py mempalace/mcp_server.py tests/test_palace_graph.py tests/test_mcp_server.py
      - run: python -m compileall -q mempalace/palace_graph.py mempalace/mcp_server.py tests/test_palace_graph.py tests/test_mcp_server.py
      - name: Commit validated rework
        run: |
          git config user.name 'MichaelWave369'
          git config user.email '247459237+MichaelWave369@users.noreply.github.com'
          git add mempalace/palace_graph.py mempalace/mcp_server.py tests/test_palace_graph.py tests/test_mcp_server.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix(graph): report complete palace graph stats'
          git push --force-with-lease origin HEAD:fix/graph-stats-completeness
