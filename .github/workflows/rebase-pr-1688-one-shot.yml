name: Rebase PR 1688 one-shot patch

on:
  push:
    branches:
      - work/pr-1688-rebase-20260816

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/pr-1688-rebase-20260816
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply current-develop version of PR 1688
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path("mempalace/mcp_server.py")
          text = path.read_text(encoding="utf-8")

          func_start = text.index("def tool_update_drawer(")
          func_end = text.index("\n\n# ==================== KNOWLEDGE GRAPH", func_start)
          func = text[func_start:func_end]

          old_sig = "def tool_update_drawer(drawer_id: str, content: str = None, wing: str = None, room: str = None):"
          new_sig = (
              "def tool_update_drawer(\n"
              "    drawer_id: str,\n"
              "    content: str = None,\n"
              "    wing: str = None,\n"
              "    room: str = None,\n"
              "    updated_by: str = None,\n"
              "):"
          )
          func = replace_once(func, old_sig, new_sig, "update_drawer signature")
          func = replace_once(
              func,
              "    if content is None and wing is None and room is None:\n",
              "    if content is None and wing is None and room is None and updated_by is None:\n",
              "update_drawer noop",
          )

          wal_start = func.index("\n        _wal_log(")
          editor_block = (
              "\n        if updated_by is not None:\n"
              "            updated_by = strip_lone_surrogates(updated_by)\n"
              "            new_meta[\"updated_by\"] = updated_by\n"
          )
          func = func[:wal_start] + editor_block + func[wal_start:]

          wal_start = func.index("        _wal_log(")
          wal_end = func.index("\n\n        chunk_size", wal_start)
          wal_block = (
              "        wal_params = {\n"
              "            \"drawer_id\": drawer_id,\n"
              "            \"old_wing\": old_meta.get(\"wing\", \"\"),\n"
              "            \"old_room\": old_meta.get(\"room\", \"\"),\n"
              "            \"new_wing\": new_meta.get(\"wing\", \"\"),\n"
              "            \"new_room\": new_meta.get(\"room\", \"\"),\n"
              "            \"content_changed\": content is not None,\n"
              "            \"content_preview\": new_doc[:200] if content is not None else None,\n"
              "        }\n"
              "        if updated_by is not None:\n"
              "            wal_params[\"updated_by\"] = updated_by\n\n"
              "        _wal_log(\"update_drawer\", wal_params)"
          )
          func = func[:wal_start] + wal_block + func[wal_end:]
          text = text[:func_start] + func + text[func_end:]

          schema_start = text.index('    "mempalace_update_drawer": {')
          schema_end = text.index('        "handler": tool_update_drawer,', schema_start)
          schema = text[schema_start:schema_end]
          schema = replace_once(
              schema,
              '        "description": "Update an existing drawer\'s content and/or metadata (wing, room). Fetches existing drawer first; returns error if not found.",',
              '        "description": "Update an existing drawer\'s content and/or metadata (wing, room, editor identity). Fetches existing drawer first; returns error if not found.",',
              "update_drawer description",
          )
          schema_close = '\n            },\n            "required": ["drawer_id"],'
          schema_insert = (
              '\n                "updated_by": {\n'
              '                    "type": "string",\n'
              '                    "description": "Who is editing this drawer (optional)",\n'
              '                },\n'
              '            },\n'
              '            "required": ["drawer_id"],'
          )
          schema = replace_once(schema, schema_close, schema_insert, "updated_by schema")
          text = text[:schema_start] + schema + text[schema_end:]
          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_mcp_server.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '        assert result.get("noop") is True\n'
          methods = textwrap.dedent(r'''
          def test_update_drawer_with_updated_by_stores_editor_metadata(
              self, monkeypatch, config, palace_path, seeded_collection, kg
          ):
              _patch_mcp_server(monkeypatch, config, kg)
              from mempalace.mcp_server import tool_update_drawer

              result = tool_update_drawer(
                  "drawer_proj_backend_aaa", updated_by="user@example.com"
              )
              assert result["success"] is True

              fetched = seeded_collection.get(
                  ids=["drawer_proj_backend_aaa"], include=["metadatas"]
              )
              metadata = fetched["metadatas"][0]
              assert metadata["updated_by"] == "user@example.com"
              assert metadata["added_by"] == "miner"

          def test_update_drawer_with_updated_by_includes_editor_in_wal_params(
              self, monkeypatch, config, palace_path, seeded_collection, kg
          ):
              _patch_mcp_server(monkeypatch, config, kg)
              from mempalace import mcp_server

              wal_calls = []
              monkeypatch.setattr(
                  mcp_server,
                  "_wal_log",
                  lambda operation, params, result=None: wal_calls.append(
                      (operation, params, result)
                  ),
              )
              result = mcp_server.tool_update_drawer(
                  "drawer_proj_backend_aaa", updated_by="user@example.com"
              )
              assert result["success"] is True
              assert wal_calls[0][0] == "update_drawer"
              assert wal_calls[0][1]["updated_by"] == "user@example.com"

          def test_update_drawer_without_updated_by_preserves_existing_behavior(
              self, monkeypatch, config, palace_path, seeded_collection, kg
          ):
              _patch_mcp_server(monkeypatch, config, kg)
              from mempalace import mcp_server

              wal_calls = []
              monkeypatch.setattr(
                  mcp_server,
                  "_wal_log",
                  lambda operation, params, result=None: wal_calls.append(
                      (operation, params, result)
                  ),
              )
              result = mcp_server.tool_update_drawer(
                  "drawer_proj_backend_aaa", content="Updated content about auth."
              )
              assert result["success"] is True

              fetched = seeded_collection.get(
                  ids=["drawer_proj_backend_aaa"], include=["metadatas"]
              )
              metadata = fetched["metadatas"][0]
              assert "updated_by" not in metadata
              assert metadata["added_by"] == "miner"
              assert "updated_by" not in wal_calls[0][1]

          def test_update_drawer_schema_exposes_updated_by(self):
              from mempalace import mcp_server

              properties = mcp_server.TOOLS["mempalace_update_drawer"]["input_schema"][
                  "properties"
              ]
              assert properties["updated_by"]["type"] == "string"
          ''').strip()
          addition = "\n\n" + textwrap.indent(methods, "    ") + "\n"
          tests = replace_once(tests, marker, marker + addition, "update_drawer tests")
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'

      - name: Targeted tests
        run: python -m pytest tests/test_mcp_server.py -q -k 'update_drawer'

      - name: Lint and format check
        run: |
          ruff check mempalace/mcp_server.py tests/test_mcp_server.py
          ruff format --check mempalace/mcp_server.py tests/test_mcp_server.py
          python -m compileall -q mempalace/mcp_server.py tests/test_mcp_server.py

      - name: Commit validated patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/rebase-pr-1688-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mempalace/mcp_server.py tests/test_mcp_server.py .github/workflows/rebase-pr-1688-one-shot.yml
          git commit -m 'feat(mcp): track editor identity on drawer updates'
          git push origin HEAD:work/pr-1688-rebase-20260816
